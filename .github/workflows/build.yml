name: Build

# every push and pull request: check the extension, pack it for Firefox (.xpi) and Chrome (.zip), and the light build for
# phones (StockCrab Lite, both formats), keep them as artifacts
# a v* tag: the same, then attach them to a GitHub release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check
        run: python3 tools/check.py

      - name: Pack for Firefox
        run: python3 packaging/build_xpi.py

      - name: Pack for Chrome
        run: python3 packaging/build_chrome.py

      - name: Pack the light build for phones
        run: python3 packaging/build_mobile.py --chrome

      - uses: actions/upload-artifact@v4
        with:
          name: stockcrab-packages
          path: |
            dist/*.xpi
            dist/*.zip
          if-no-files-found: error

      # Mozilla signs both Firefox builds as unlisted (not in the store, installs in any Firefox); needs the AMO_JWT_* secrets,
      # without them the release keeps the unsigned files
      - name: Sign for Firefox
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_JWT_ISSUER != ''
        run: |
          set -e
          v="${GITHUB_REF_NAME#v}"
          for pair in "src/stockcrab:stockcrab-$v.xpi" "dist/mobile:stockcrab-lite-$v.xpi"; do
            src="${pair%%:*}"; out="${pair##*:}"
            rm -rf dist/signed && mkdir -p dist/signed
            npx --yes web-ext@8 sign --channel unlisted --source-dir "$src" --artifacts-dir dist/signed \
              --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --timeout 1800000 --approval-timeout 1800000
            mv dist/signed/*.xpi "dist/$out"
            echo "signed $out"
          done
          rm -rf dist/signed

      # Firefox's update manifest: installed copies (the full one and Lite) update themselves from the latest release
      - name: Update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]; v = tag[1:]
          base = f"https://github.com/${{ github.repository }}/releases/download/{tag}"
          addons = {}
          for manifest, xpi in (("src/stockcrab/manifest.json", f"stockcrab-{v}.xpi"), ("dist/mobile/manifest.json", f"stockcrab-lite-{v}.xpi")):
              gecko = json.load(open(manifest))["browser_specific_settings"]["gecko"]
              addons[gecko["id"]] = {"updates": [{"version": v, "update_link": f"{base}/{xpi}"}]}
          json.dump({"addons": addons}, open("dist/updates.json", "w"), indent=2)
          PY

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.xpi dist/*.zip dist/updates.json --clobber
          else
            gh release create "$TAG" dist/*.xpi dist/*.zip dist/updates.json --title "StockCrab ${TAG#v}" --generate-notes \
              --notes "Firefox: **stockcrab-${TAG#v}.xpi**. Chrome, Edge, Brave: **stockcrab-chrome-${TAG#v}.zip** (unzip, then Load unpacked). Phones: **stockcrab-lite-${TAG#v}.xpi** (Firefox for Android) or **stockcrab-lite-chrome-${TAG#v}.zip**. See the README."
          fi
