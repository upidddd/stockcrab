name: Build

# every push and pull request: check the extension, pack it for Firefox (.xpi) and Chrome (.zip), keep both as artifacts
# a v* tag: the same, then attach both to a GitHub release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check
        run: python3 tools/check.py

      - name: Pack for Firefox
        run: python3 packaging/build_xpi.py

      - name: Pack for Chrome
        run: python3 packaging/build_chrome.py

      - uses: actions/upload-artifact@v4
        with:
          name: stockcrab-packages
          path: |
            dist/*.xpi
            dist/*.zip
          if-no-files-found: error

      # Firefox's update manifest: installed copies update themselves from the latest release
      - name: Update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]; v = tag[1:]
          gecko = json.load(open("src/stockcrab/manifest.json"))["browser_specific_settings"]["gecko"]
          url = f"https://github.com/${{ github.repository }}/releases/download/{tag}/stockcrab-{v}.xpi"
          json.dump({"addons": {gecko["id"]: {"updates": [{"version": v, "update_link": url}]}}}, open("dist/updates.json", "w"), indent=2)
          PY

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.xpi dist/*.zip dist/updates.json --clobber
          else
            gh release create "$TAG" dist/*.xpi dist/*.zip dist/updates.json --title "StockCrab ${TAG#v}" --generate-notes \
              --notes "Firefox: **stockcrab-${TAG#v}.xpi**. Chrome, Edge, Brave: **stockcrab-chrome-${TAG#v}.zip** (unzip, then Load unpacked). See the README."
          fi
