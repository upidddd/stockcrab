name: Build

# every push and pull request: check the extension and pack it, keep the .xpi as an artifact
# a v* tag: the same, then publish it on a GitHub release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check
        run: python3 tools/check.py

      - name: Pack
        run: python3 packaging/build_xpi.py

      - uses: actions/upload-artifact@v4
        with:
          name: stockcrab-xpi
          path: dist/*.xpi
          if-no-files-found: error

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.xpi --clobber
          else
            gh release create "$TAG" dist/*.xpi --title "StockCrab ${TAG#v}" --generate-notes \
              --notes "Download **stockcrab-${TAG#v}.xpi**, or load the \`src/stockcrab\` folder from the source in \`about:debugging\` (see the README)."
          fi
